name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Verify formatting and vet
        run: |
          test -z "$(gofmt -l .)"
          go vet ./...

      - name: Build binary
        run: go build -o syncfault ./cmd/syncfault

      - name: Run unit tests
        run: go test -v -race ./...

      - name: Run environment doctor
        run: ./syncfault doctor
