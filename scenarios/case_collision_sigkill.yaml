name: case_collision_sigkill
description: Case-only file renames interrupted by SIGKILL to test case-folding replica safety.
workload:
  recipe: case_collision
  sides: [A]
  params:
    files: 6
    file_size: { min: 512B, max: 8KiB }
fault:
  type: sigkill
  at:
    op_index: 9
    jitter_ms: { min: 5, max: 40, seeded: true }
expect:
  conflict_policy: default
runs:
  seeds: [1..10]
  timeout_s: 60
