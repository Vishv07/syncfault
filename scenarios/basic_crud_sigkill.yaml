# scenarios/basic_crud_sigkill.yaml
name: basic_crud_sigkill
description: Standard create/edit/rename/delete sequence interrupted by SIGKILL.
workload:
  recipe: basic_crud
  params:
    depth: 3
    files: 12
    file_size: { min: 512B, max: 16KiB }
  sides: [A]
fault:
  type: sigkill
  at:
    op_index: 6
    jitter_ms: { min: 0, max: 15, seeded: true }
  params: {}
expect:
  conflict_policy: default
runs:
  seeds: [1..50]
  timeout_s: 120
